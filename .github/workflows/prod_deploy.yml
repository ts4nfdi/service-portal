name: Deployment to production
concurrency: production
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Do you really want to update the production instance"
        required: false
        type: boolean
      image_sha:
        description: "Image SHA ID, Optional "
        type: string
        required: false

env:
  KUBECONFIG: .kube/config

jobs:
  deploy_main:
    environment: release-k8s
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Kubernetes config
        env:
          KUBECONFIG_FILE: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          set +x
          umask 077
          mkdir -p .kube
          printf '%s' "$KUBECONFIG_FILE" > "$KUBECONFIG"

      - name: Create K8s secret for SMTP_API_KEY
        env:
          SECRET_VALUE: ${{ secrets.SMTP_API_KEY }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-smtp-api-key SMTP_API_KEY

      - name: Create K8s secret for SMTP_USERNAME
        env:
          SECRET_VALUE: ${{ secrets.SMTP_USERNAME }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-smtp-username SMTP_USERNAME

      - name: Create K8s secret for SMTP_PASSWORD
        env:
          SECRET_VALUE: ${{ secrets.SMTP_PASSWORD }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-smtp-password SMTP_PASSWORD

      - name: Create K8s secret for SMTP_PORT
        env:
          SECRET_VALUE: ${{ vars.SMTP_PORT }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-smtp-port SMTP_PORT

      - name: Create K8s secret for CAPTCHA_VALIDATION_URL
        env:
          SECRET_VALUE: ${{ secrets.CAPTCHA_VALIDATION_URL }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-captcha-validation-url CAPTCHA_VALIDATION_URL

      - name: Create K8s secret for CAPTCHA_API_KEY
        env:
          SECRET_VALUE: ${{ secrets.CAPTCHA_API_KEY }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-captcha-api-key CAPTCHA_API_KEY

      - name: Create K8s secret for AUTH_SECRET
        env:
          SECRET_VALUE: ${{ secrets.AUTH_SECRET }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-auth-secret AUTH_SECRET

      - name: Create K8s secret for CONTACT_RECV_EMAIL
        env:
          SECRET_VALUE: ${{ vars.CONTACT_RECV_EMAIL }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-contact-recv-email CONTACT_RECV_EMAIL

      - name: Create K8s secret for SMTP_HOST_NAME
        env:
          SECRET_VALUE: ${{ vars.SMTP_HOST_NAME }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-smtp-host-name SMTP_HOST_NAME

      - name: Create K8s secret for SERVICE_EMAIL
        env:
          SECRET_VALUE: ${{ vars.SERVICE_EMAIL }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-smtp-service-email SERVICE_EMAIL

      - name: Create K8s secret for GATEWAY_BASE_URL
        env:
          SECRET_VALUE: ${{ vars.GATEWAY_BASE_URL }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-gateway-base-url GATEWAY_BASE_URL

      - name: Create K8s secret for NEXTAUTH_URL
        env:
          SECRET_VALUE: ${{ vars.NEXTAUTH_URL }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-nextauth-url NEXTAUTH_URL

      - name: Create K8s secret for NEXT_IAM_REDIRECT_URL
        env:
          SECRET_VALUE: ${{ vars.NEXT_IAM_REDIRECT_URL || vars.NEXTAUTH_URL }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-iam-redirect-url NEXT_IAM_REDIRECT_URL

      - name: Create K8s secret for MATOMO_TRACKER_ID
        env:
          SECRET_VALUE: ${{ vars.NEXT_PUBLIC_MATOMO_TRACKER_ID || secrets.NEXT_PUBLIC_MATOMO_TRACKER_ID }}
        run: bash .github/scripts/apply-k8s-secret.sh ts4nfdi-service-portal-matomo-tracker-id MATOMO_TRACKER_ID

      - name: Deploy to Kubernetes
        uses: stefanprodan/kube-tools@v1
        with:
          helmv3: 3.12.0
          command: |
            set -e
            helmv3 repo add service-portal-deployment https://ts4nfdi.github.io/service-portal-deployment/
            helmv3 repo update
            helmv3 upgrade ts4nfdi-service-portal  \
            --install \
            --namespace='ts4nfdi' \
            --set-json='ingress.dns="terminology.services.base4nfdi.de"'  \
            --set-json='ingress.redirectDns="ts.services.base4nfdi.de"'  \
            --set-json='images.ui="ghcr.io/${{ github.repository }}:${{ inputs.image_sha|| github.sha }}"' \
            --set-json='ingress.path="/"' \
            --set-json='ingress.enableSSL="true"'  \
            --set-json='ingress.certIssuer="letsencrypt-prod"'  \
            service-portal-deployment/service-portal-ui
            kubectl patch deployment/ts4nfdi-service-portal-ui --namespace=ts4nfdi --type=strategic --patch-file=.github/k8s/nextauth-env-patch.yaml
            kubectl rollout restart deployment/ts4nfdi-service-portal-ui --namespace='ts4nfdi'
            kubectl rollout status deployment/ts4nfdi-service-portal-ui --namespace='ts4nfdi' --timeout=180s
