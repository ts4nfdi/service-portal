name: Release Service Portal

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  KUBECONFIG: .kube/config

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: generate-image-tag
        name: Generate Image Tag
        env:
          # The branch or tag name that triggered the workflow
          ref_name: "${{ github.ref_name }}"
          # The source branch of a pull request (only set in PRs)
          head_ref: "${{ github.head_ref }}"
        # Replace slashes in branch names, determine final image name, set output variable imageTag
        run: |
          head_ref="${head_ref/\//-}"
          ref_name="${head_ref:-${ref_name/main/latest}}"
          ref_name="${ref_name#v}"
          echo "imageTag=$ref_name" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          # use a) human-readable and b) immutable tag
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.generate-image-tag.outputs.imageTag }}
            ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha || github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}

  deploy_main:
    environment: release-k8s-qa
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Kubernetes config
        env:
          KUBECONFIG_FILE: ${{ secrets.KUBECONFIG }}
        run: |
          set +x
          umask 077
          mkdir -p .kube
          printf '%s' "$KUBECONFIG_FILE" > "$KUBECONFIG"

      - name: Create K8s secrets
        env:
          SMTP_API_KEY: ${{ secrets.SMTP_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CAPTCHA_VALIDATION_URL: ${{ secrets.CAPTCHA_VALIDATION_URL }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CONTACT_RECV_EMAIL: ${{ vars.CONTACT_RECV_EMAIL }}
          SMTP_HOST_NAME: ${{ vars.SMTP_HOST_NAME }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SERVICE_EMAIL: ${{ vars.SERVICE_EMAIL }}
          GATEWAY_BASE_URL: ${{ vars.GATEWAY_BASE_URL }}
          STATISTICS_SERVICE_PORTAL_KEY: ${{ secrets.STATISTICS_SERVICE_PORTAL_KEY }}
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          NEXT_IAM_REDIRECT_URL: ${{ vars.NEXT_IAM_REDIRECT_URL || vars.NEXTAUTH_URL }}
          MATOMO_TRACKER_ID: ${{ vars.NEXT_PUBLIC_MATOMO_TRACKER_ID || secrets.NEXT_PUBLIC_MATOMO_TRACKER_ID }}
        run: |
          set +x
          set -euo pipefail

          mask() {
            local value="$1"
            value="${value//%/%25}"
            value="${value//$'\r'/%0D}"
            value="${value//$'\n'/%0A}"
            printf '::add-mask::%s\n' "$value"
          }

          apply_secret() {
            mask "$3"
            mask "$(printf '%s' "$3" | base64 -w 0)"

            if ! kubectl create secret generic "$1" \
              --from-literal="$2=$3" \
              --namespace=ts4nfdi --dry-run=client -o yaml 2>/dev/null |
              kubectl apply -f - >/dev/null 2>&1; then
              printf '::error::Failed to apply Kubernetes Secret %s\n' "$1" >&2
              exit 1
            fi
          }

          apply_secret ts4nfdi-service-portal-smtp-api-key SMTP_API_KEY "$SMTP_API_KEY"
          apply_secret ts4nfdi-service-portal-smtp-username SMTP_USERNAME "$SMTP_USERNAME"
          apply_secret ts4nfdi-service-portal-smtp-password SMTP_PASSWORD "$SMTP_PASSWORD"
          apply_secret ts4nfdi-service-portal-captcha-validation-url CAPTCHA_VALIDATION_URL "$CAPTCHA_VALIDATION_URL"
          apply_secret ts4nfdi-service-portal-captcha-api-key CAPTCHA_API_KEY "$CAPTCHA_API_KEY"
          apply_secret ts4nfdi-service-portal-auth-secret AUTH_SECRET "$AUTH_SECRET"
          apply_secret ts4nfdi-service-portal-contact-recv-email CONTACT_RECV_EMAIL "$CONTACT_RECV_EMAIL"
          apply_secret ts4nfdi-service-portal-smtp-host-name SMTP_HOST_NAME "$SMTP_HOST_NAME"
          apply_secret ts4nfdi-service-portal-smtp-port SMTP_PORT "$SMTP_PORT"
          apply_secret ts4nfdi-service-portal-smtp-service-email SERVICE_EMAIL "$SERVICE_EMAIL"
          apply_secret ts4nfdi-service-portal-gateway-base-url GATEWAY_BASE_URL "$GATEWAY_BASE_URL"
          apply_secret statistics-service-portal-key STATISTICS_SERVICE_PORTAL_KEY "$STATISTICS_SERVICE_PORTAL_KEY"
          apply_secret ts4nfdi-service-portal-nextauth-url NEXTAUTH_URL "$NEXTAUTH_URL"
          apply_secret ts4nfdi-service-portal-iam-redirect-url NEXT_IAM_REDIRECT_URL "$NEXT_IAM_REDIRECT_URL"
          apply_secret ts4nfdi-service-portal-matomo-tracker-id MATOMO_TRACKER_ID "$MATOMO_TRACKER_ID"

      - name: Deploy to Kubernetes
        uses: stefanprodan/kube-tools@v1
        with:
          helmv3: 3.12.0
          command: |
            set -e
            kubectl get nodes
            helmv3 repo add service-portal-deployment https://ts4nfdi.github.io/service-portal-deployment/
            helmv3 repo update
            helmv3 upgrade ts4nfdi-service-portal \
              --install \
              --namespace='ts4nfdi' \
              --set-json='ingress.dns="ts4nfdi-service-portal.qa.km.k8s.zbmed.de"'  \
              --set-json='images.ui="ghcr.io/${{ github.repository }}:${{ github.event.pull_request.head.sha || github.sha }}"' \
              --set-json='ingress.path="/"' \
              service-portal-deployment/service-portal-ui
            kubectl patch deployment/ts4nfdi-service-portal-ui --namespace=ts4nfdi --type=strategic --patch-file=/dev/stdin <<'PATCH'
            spec:
              template:
                spec:
                  containers:
                    - name: ts4nfdi-service-portal-ui
                      env:
                        - name: STATISTICS_SERVICE_BASE_URL
                          value: http://ts4nfdi-api-gateway-collection-statistics:8000
                        - name: STATISTICS_SERVICE_PORTAL_KEY
                          valueFrom:
                            secretKeyRef:
                              name: statistics-service-portal-key
                              key: STATISTICS_SERVICE_PORTAL_KEY
                        - name: NEXTAUTH_URL
                          valueFrom:
                            secretKeyRef:
                              name: ts4nfdi-service-portal-nextauth-url
                              key: NEXTAUTH_URL
                        - name: NEXT_IAM_REDIRECT_URL
                          valueFrom:
                            secretKeyRef:
                              name: ts4nfdi-service-portal-iam-redirect-url
                              key: NEXT_IAM_REDIRECT_URL
                        - name: MATOMO_TRACKER_ID
                          valueFrom:
                            secretKeyRef:
                              name: ts4nfdi-service-portal-matomo-tracker-id
                              key: MATOMO_TRACKER_ID
            PATCH
            kubectl rollout restart deployment/ts4nfdi-service-portal-ui --namespace='ts4nfdi'
            kubectl rollout status deployment/ts4nfdi-service-portal-ui --namespace='ts4nfdi' --timeout=180s
