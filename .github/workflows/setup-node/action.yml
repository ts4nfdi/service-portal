name: setup-node
description: "Setup Node.js - Cache npm - Install dependencies"
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Cache npm
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: npm-cache-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      shell: bash
      run: npm ci
